name: Release

# 推 v* 标签 → 在 windows-latest 上出安装包，发布到本仓库同名 Release；已安装的客户端从这里自动更新。
# 用的是 Actions 自带的 GITHUB_TOKEN（下面 permissions 给了 contents: write），不需要额外配置 secret。
# 手动触发（workflow_dispatch）只出包、不发布，安装包在本次运行的 Artifacts 里。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMHvH-Setup
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
